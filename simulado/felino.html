<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Felinos</title>
    <script src="java/javafelino.js" defer></script>
    <link rel="stylesheet" href="CSS/stilofelino.css">
</head>
<body>
    <div class="gatos">

        <div class="retratos">
            <img src="CSS/img/gato01.gif" alt="" width="100" id="gato01">
            <p>Clique em mim!</p>
        </div>

        <div class="retratos">
            <img src="CSS/img/gato02.gif" alt="" width="100" id="gato02">
            <p>Clique sobre mim várias vezes!</p>
            <p>Carinhos: <span id="contador">0</span></p>
        </div>

        <div class="retratos">
            <img src="CSS/img/gato03.gif" alt="" width="100" id="gato03">
            <p>Passe o cursor do mouse sobre mim!</p>
        </div>

        <div class="retratos">
            <img src="CSS/img/gato04.gif" alt="" width="100" id="gato04">
            <p id="textoGato4">lá lá lá lá lá</p>
        </div>

        <div class="retratos">
            <img src="CSS/img/gato05.gif" alt="" width="100" id="gato05">
            <br>
            <button id="btnSorte">Gerar número da sorte</button>
            <br><br>
            <input type="text" id="numSorte" readonly>
        </div>

    </div>
</body>
</html>
