<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="java.js" defer></script>
    <link rel="stylesheet" href="stilos.css">
</head>
<body>
    <h1 >Acesso ao Sistema</h1>
    <table>
        <tr>
            <td><label for="login">Login:</label></td>
            <td><input type="text" id="login"></td>
        </tr>
    <tr>
    <td><label for="senha">Senha:</label></td>
    <td>
        <input type="password" id="senha" value="">
        <span style="color: red; font-family: Verdana; font-size: 11px;">max. 8 caracteres</span>
    </td>
    </tr>
    <tr>
    <td><label for="confirma">Confirmar Senha:</label></td>
    <td>
        <input type="password" id="confirma" value="">
        <span style="color: red; font-family: Verdana; font-size: 11px;">max. 8 caracteres</span>
    </td>
    <tr>
            <td>
                <input type="button"  id="entra" value="Entrar">
                <input type="reset" value="Limpar">
            </td>
    </table>
</body>
</html>
